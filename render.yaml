# Déploiement en un clic sur Render (https://render.com) : New > Blueprint > ce dépôt.
services:
  - type: web
    name: facturo
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: facturo-data
      mountPath: /data
      sizeGB: 1
